
services:
  pd:
    image: pingcap/pd:v7.5.0
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - pd-data:/data
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://pd:2379/health" ]
      interval: 5s
      timeout: 3s
      retries: 60

  tikv:
    image: pingcap/tikv:v7.5.0
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --pd=pd:2379
      - --data-dir=/data/tikv
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      - pd
    volumes:
      - tikv-data:/data

  tidb:
    image: pingcap/tidb:v7.5.0
    command:
      - --store=tikv
      - --path=pd:2379
      - --advertise-address=tidb
      - --status=10080
    ports:
      - "127.0.0.1:4000:4000" # MySQL protocol - local only
      - "127.0.0.1:10080:10080" # status - local only
    depends_on:
      - pd
      - tikv
    healthcheck:
      test: [ "CMD", "sh", "-c", "echo matan" ]
      interval: 5s
      timeout: 3s
      retries: 60

  ticdc:
    image: pingcap/ticdc:v7.5.0
    entrypoint: ["/bin/sh","-lc"]
    command:
      - |
        exec /cdc server \
          --addr=0.0.0.0:8300 \
          --advertise-addr=:8300 \
          --pd=http://pd:2379
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      - pd
      - tikv
      - tidb
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://ticdc:8300/api/v2/status | grep -q '\"is_owner\": true'"]
      interval: 5s
      timeout: 3s
      retries: 40


  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"     # אופציונלי (פנימי/דיבוג)
      - "19092:19092"   # listener חיצוני ל־host
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "bash", "-lc", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  node-consumer:
    build:
      context: ./node-consumer
    environment:
      KAFKA_BROKERS: "kafka:9092"
      TOPIC: "tidb-cdc"
      GROUP_ID: "cdc-node-consumer-group"
      PROM_PORT: "3000"
    depends_on:
      - kafka
    ports:
      - "3000:3000"   # כדי שתוכל לראות /metrics ו-/healthz מה־host
    restart: unless-stopped
    labels:
      co.elastic.logs/enabled: "true"


  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node-consumer
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.6
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - elasticsearch
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    restart: unless-stopped

  filebeat:
    image: elastic/filebeat:8.14.3
    user: root
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - elasticsearch
    # (רשות) הרשאות עזר לקריאת קבצים/סימלינקים
    # cap_add:
    #   - DAC_READ_SEARCH
    #   - CHOWN

    # --- JOB 1: אתחול בסיס נתונים ---
  db-init:
    image: pingcap/tidb:v7.5.0
    depends_on:
      tidb:
        condition: service_healthy
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: [ "sh", "-lc" ]
    command: >
      '
      echo "[db-init] waiting for TiDB...";
      for i in $(seq 1 60); do
        mysql -htidb -P4000 -uroot -e "SELECT 1" >/dev/null 2>&1 && break;
        sleep 2;
      done;
      echo "[db-init] applying init.sql";
      mysql -htidb -P4000 -uroot < /init.sql
      '
    restart: "no"

  # --- JOB 2: יצירת topic בקאפקה (בטוח גם אם קיים) ---
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "bash", "-lc" ]
    command: >
      '
      echo "[kafka-init] ensuring topic tidb-cdc exists";
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic tidb-cdc --partitions 1 --replication-factor 1 || true;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list;
      '
    restart: "no"

  # --- JOB 3: יצירת changefeed ב-TiCDC ---
  ticdc-init:
    image: pingcap/ticdc:v7.5.0
    depends_on:
      pd:
        condition: service_healthy
      ticdc:
        condition: service_healthy
      kafka:
        condition: service_healthy
    entrypoint: [ "sh", "-lc" ]
    command: >
      '
      echo "[ticdc-init] wait for PD & Kafka";
      for i in $(seq 1 60); do
        wget -qO- http://pd:2379/pd/api/v1/status >/dev/null 2>&1 && break;
        sleep 2;
      done;
      # בדיקת חיבור בסיסית לקאפקה (TCP) – אופציונלי
      (echo > /dev/tcp/kafka/9092) >/dev/null 2>&1 || sleep 2;

      echo "[ticdc-init] creating changefeed if not exists";
      /cdc cli changefeed list --server=http://ticdc:8300 | grep -q "\"id\": \"c1\"" \
        || /cdc cli changefeed create \
             --server=http://ticdc:8300 \
             --changefeed-id=c1 \
             --sink-uri="kafka://kafka:9092/tidb-cdc?protocol=canal-json&max-message-bytes=1048576";

      echo "[ticdc-init] current changefeeds:";
      /cdc cli changefeed list --server=http://ticdc:8300;

      '
    restart: "no"




volumes:
  pd-data:
  tikv-data: