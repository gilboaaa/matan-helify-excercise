
services:
  pd:
    image: pingcap/pd:v7.5.0
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - pd-data:/data
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://pd:2379/health" ]
      interval: 5s
      timeout: 3s
      retries: 60

  tikv:
    image: pingcap/tikv:v7.5.0
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --pd=pd:2379
      - --data-dir=/data/tikv
    depends_on:
      - pd
    volumes:
      - tikv-data:/data

  tidb:
    image: pingcap/tidb:v7.5.0
    command:
      - --store=tikv
      - --path=pd:2379
      - --advertise-address=tidb
      - --status=10080
    ports:
      - "127.0.0.1:4000:4000" # MySQL protocol - local only
      - "127.0.0.1:10080:10080" # status - local only
    depends_on:
      - pd
      - tikv
    healthcheck:
      test: [ "CMD", "sh", "-c", "mysql -h127.0.0.1 -P4000 -uroot -e 'select 1'" ]
      interval: 5s
      timeout: 3s
      retries: 60

  ticdc:
    image: pingcap/ticdc:v7.5.0
    entrypoint: ["/bin/sh","-lc"]
    command:
      - |
        exec /cdc server \
          --addr=0.0.0.0:8300 \
          --advertise-addr=:8300 \
          --pd=http://pd:2379
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      - pd
      - tikv
      - tidb


  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"     # אופציונלי (פנימי/דיבוג)
      - "19092:19092"   # listener חיצוני ל־host
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  node-consumer:
    build:
      context: ./node-consumer
    environment:
      KAFKA_BROKERS: "kafka:9092"
      TOPIC: "tidb-cdc"
      GROUP_ID: "cdc-node-consumer-group"
      PROM_PORT: "3000"
    depends_on:
      - kafka
    ports:
      - "3000:3000"   # כדי שתוכל לראות /metrics ו-/healthz מה־host
    restart: unless-stopped
    labels:
      co.elastic.logs/enabled: "true"


  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node-consumer
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.6
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - elasticsearch
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    user: root
    command: ["filebeat","--strict.perms=false", "-e"]
    depends_on:
      - elasticsearch
      - node-consumer
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/docker/containers:/var/docker/containers/:ro
    restart: unless-stopped






volumes:
  pd-data:
  tikv-data: